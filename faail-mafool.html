<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>صاروخ الفاعل والمفعول</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="لعبة تعليمية تفاعلية - أكاديمية همم التعليمية">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Naskh+Arabic:wght@500;700&family=Tajawal:wght@500;700;800&display=swap">
<style>
/* Layout: full-bleed canvas world; HUD strip on top, prompt banner beneath it,
   answer objects live inside the world, other challenges in a floating card. */
:root{
  --ink:#fdfaf3; --ink-dim:rgba(253,250,243,.78);
  --glass:rgba(12,18,32,.62); --glass-line:rgba(255,255,255,.16);
  --card:#fffaf0; --card-ink:#1d2433; --card-line:#e7dcc6;
  --ok:#2fbf71; --ok-soft:#dff7e9; --bad:#e5484d; --bad-soft:#fde4e4; --warn:#f5a524;
  --f-display:"Lalezar","Tajawal",system-ui,sans-serif;
  --f-text:"Noto Naskh Arabic","Amiri","Tahoma",serif;
  --f-ui:"Tajawal","Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;}
body{margin:0;background:var(--bg0);color:var(--ink);font-family:var(--f-ui);overflow:hidden;
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;}
#app{position:fixed;inset:0;overflow:hidden;direction:rtl;}
#world{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;}
button{font-family:inherit;cursor:pointer;}
button:focus-visible{outline:3px solid var(--accent);outline-offset:3px;}

/* ---------- HUD ---------- */
#hud{position:absolute;top:0;left:0;right:0;z-index:20;display:flex;align-items:center;gap:10px;
  padding:calc(8px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) 8px max(12px,env(safe-area-inset-left,0px));
  background:linear-gradient(to bottom,rgba(0,0,0,.45),rgba(0,0,0,0));pointer-events:none;}
#hud > *{pointer-events:auto;}
.hud-logo{width:34px;height:34px;border-radius:50%;background:#fff;padding:2px;flex:none;box-shadow:0 2px 8px rgba(0,0,0,.3);}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;}
.hud-title{font-family:var(--f-display);font-size:15px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.5);}
#bar{display:flex;gap:3px;direction:rtl;}
#bar i{flex:1;height:7px;border-radius:4px;background:rgba(255,255,255,.22);transition:background .3s;}
#bar i.cur{background:var(--accent);animation:pulse 1s infinite alternate;}
#bar i.c{background:var(--ok);} #bar i.m{background:var(--warn);} #bar i.r{background:var(--bad);}
#bar i.gap{margin-left:5px;}
@keyframes pulse{from{opacity:.55}to{opacity:1}}
.hud-stats{display:flex;align-items:center;gap:8px;flex:none;}
.pill{display:flex;align-items:center;gap:4px;background:var(--glass);border:1px solid var(--glass-line);
  border-radius:999px;padding:4px 10px;font-weight:800;font-size:14px;font-variant-numeric:tabular-nums;backdrop-filter:blur(6px);}
.pill svg{width:16px;height:16px;}
#hearts{display:flex;gap:2px;}
#hearts svg{width:17px;height:17px;transition:transform .3s,opacity .3s;}
#hearts svg.lost{opacity:.25;transform:scale(.8);filter:grayscale(1);}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-line);background:var(--glass);
  color:var(--ink);display:grid;place-items:center;padding:0;backdrop-filter:blur(6px);}
.icon-btn svg{width:18px;height:18px;}
.icon-btn.off{opacity:.45;}
.bump{animation:bump .45s;}
@keyframes bump{40%{transform:scale(1.35)}}

/* ---------- Prompt banner ---------- */
#banner{position:absolute;z-index:15;left:50%;transform:translateX(-50%);top:calc(62px + env(safe-area-inset-top,0px));
  width:min(760px,calc(100% - 24px));background:var(--glass);border:1px solid var(--glass-line);border-radius:18px;
  padding:10px 16px 12px;backdrop-filter:blur(8px);box-shadow:0 10px 30px rgba(0,0,0,.25);text-align:center;}
#banner[hidden]{display:none!important;}
.b-tag{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--accent);margin-bottom:4px;}
.b-tag b{background:var(--accent);color:var(--accent-ink);border-radius:6px;padding:1px 7px;}
#bq{font-family:var(--f-text);font-size:clamp(18px,2.6vw + 8px,26px);line-height:1.65;font-weight:700;text-wrap:balance;}
#bq .hl{color:var(--accent);}
.bin-count{font-family:var(--f-ui);font-size:14px;color:var(--ink-dim);margin-top:2px;font-weight:700;}
.banner-in{animation:dropIn .45s cubic-bezier(.2,1.4,.4,1);}
@keyframes dropIn{from{opacity:0;transform:translate(-50%,-20px)}to{opacity:1;transform:translate(-50%,0)}}

/* ---------- World choices ---------- */
#choices{position:absolute;inset:0;z-index:12;pointer-events:none;}
.choice{position:absolute;transform:translate(-50%,-50%);pointer-events:auto;border:0;
  font-family:var(--f-text);font-weight:700;font-size:clamp(15px,1.3vw + 9px,20px);line-height:1.45;
  padding:12px 16px;min-width:96px;max-width:var(--cw,240px);text-align:center;color:var(--choice-ink);
  animation:popIn .5s cubic-bezier(.2,1.5,.4,1) backwards;transition:filter .2s,opacity .3s;}
.choice:hover{filter:brightness(1.08);}
.choice .k{position:absolute;top:-10px;right:-8px;width:22px;height:22px;border-radius:50%;font:800 12px/22px var(--f-ui);
  background:var(--accent);color:var(--accent-ink);box-shadow:0 2px 6px rgba(0,0,0,.3);}
.choice.ok{animation:okPulse .7s;filter:drop-shadow(0 0 14px var(--ok));}
.choice.ok::after{content:"";position:absolute;inset:-4px;border-radius:inherit;border:3px solid var(--ok);}
.choice.bad{animation:shake .45s;opacity:.38;pointer-events:none;filter:grayscale(.8);}
.choice.dim{opacity:.25;pointer-events:none;}
@keyframes popIn{from{opacity:0;transform:translate(-50%,-50%) scale(.3)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
@keyframes okPulse{30%{transform:translate(-50%,-50%) scale(1.15)}}
@keyframes shake{20%,60%{transform:translate(calc(-50% - 8px),-50%)}40%,80%{transform:translate(calc(-50% + 8px),-50%)}}

/* ---------- Challenge card ---------- */
#panel{position:absolute;z-index:16;left:50%;transform:translateX(-50%);width:min(720px,calc(100% - 24px));
  max-height:calc(100% - var(--panel-top,200px) - 16px - env(safe-area-inset-bottom,0px));overflow:auto;
  top:var(--panel-top,200px);background:var(--card);color:var(--card-ink);border-radius:20px;padding:16px;
  box-shadow:0 20px 50px rgba(0,0,0,.35);border:3px solid var(--accent);animation:panelIn .45s cubic-bezier(.2,1.3,.4,1);}
#panel[hidden]{display:none!important;}
@keyframes panelIn{from{opacity:0;transform:translate(-50%,30px) scale(.95)}to{opacity:1;transform:translate(-50%,0)}}
.p-hint{font-size:13px;font-weight:700;color:#6b6252;margin:0 0 10px;text-align:center;}
.chip{font-family:var(--f-text);font-weight:700;font-size:clamp(15px,1vw + 11px,19px);line-height:1.5;border-radius:12px;
  padding:8px 14px;background:#fff;color:var(--card-ink);border:2px solid var(--card-line);box-shadow:0 3px 0 var(--card-line);
  transition:transform .15s,background .2s,border-color .2s,opacity .2s;touch-action:none;}
.chip:hover{transform:translateY(-2px);}
.chip.sel{border-color:var(--accent2);background:var(--accent2-soft);box-shadow:0 3px 0 var(--accent2);}
.chip.ok{background:var(--ok-soft);border-color:var(--ok);box-shadow:0 3px 0 var(--ok);pointer-events:none;}
.chip.bad{background:var(--bad-soft);border-color:var(--bad);animation:shk .4s;}
.chip.used{opacity:.25;pointer-events:none;}
@keyframes shk{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;}
.ghost{position:fixed;z-index:100;pointer-events:none;transform:translate(-50%,-50%) rotate(-3deg) scale(1.08);
  box-shadow:0 12px 24px rgba(0,0,0,.3);}
.sentence{font-family:var(--f-text);font-size:clamp(20px,1.6vw + 14px,28px);line-height:2.1;text-align:center;margin:4px 0 14px;font-weight:700;}
.slot{display:inline-block;min-width:110px;border-bottom:3px dashed var(--accent2);margin:0 6px;padding:0 8px;color:var(--accent2);
  border-radius:8px;transition:background .2s;}
.slot.over{background:var(--accent2-soft);}
.slot.ok{border-bottom-color:var(--ok);color:#13804a;background:var(--ok-soft);}
.tok{font:inherit;border:0;background:transparent;color:inherit;padding:2px 6px;border-radius:10px;border-bottom:3px solid transparent;}
.tok:hover{background:var(--accent2-soft);}
.tok.ok{background:var(--ok-soft);border-bottom-color:var(--ok);}
.tok.bad{background:var(--bad-soft);border-bottom-color:var(--bad);animation:shk .4s;}
.gapbtn{font:800 20px var(--f-ui);width:30px;height:38px;vertical-align:middle;border-radius:10px;border:2px dashed var(--accent2);
  background:var(--accent2-soft);color:var(--accent2);margin:0 2px;padding:0;}
.gapbtn.ok{border:2px solid var(--ok);background:var(--ok-soft);color:#13804a;}
.gapbtn.bad{border-color:var(--bad);background:var(--bad-soft);color:var(--bad);animation:shk .4s;}
.answer-row{min-height:64px;border-radius:14px;border:2px dashed var(--card-line);padding:10px;margin-bottom:12px;background:#fdf6e6;
  display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;}
.answer-row:empty::before{content:attr(data-ph);color:#a3987f;font-size:14px;font-weight:700;}
.btn{font-family:var(--f-display);font-size:20px;border:0;border-radius:14px;padding:10px 26px;background:var(--accent);color:var(--accent-ink);
  box-shadow:0 5px 0 var(--accent-deep);transition:transform .1s;}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep);}
.btn[disabled]{opacity:.45;pointer-events:none;}
.btn.alt{background:#fff;color:var(--card-ink);box-shadow:0 5px 0 var(--card-line);}
.center{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px 18px;}
.match .col{display:flex;flex-direction:column;gap:10px;min-width:0;}
.match .chip{width:100%;}
.match .chip.p0{background:#e3f1ff;border-color:#3b82f6;box-shadow:0 3px 0 #3b82f6;}
.match .chip.p1{background:#fbe6ff;border-color:#b545d8;box-shadow:0 3px 0 #b545d8;}
.match .chip.p2{background:#fff1d6;border-color:#e08a00;box-shadow:0 3px 0 #e08a00;}
.match .chip.p3{background:#dcf7ef;border-color:#0f9f7a;box-shadow:0 3px 0 #0f9f7a;}
.bins{display:grid;gap:10px;grid-template-columns:repeat(var(--n),minmax(0,1fr));margin-top:12px;}
.bin{border-radius:16px;border:3px dashed var(--card-line);background:#fdf6e6;min-height:120px;padding:8px;display:flex;flex-direction:column;gap:6px;
  align-items:stretch;transition:border-color .2s,background .2s;}
.bin h4{margin:0 0 4px;font-family:var(--f-display);font-weight:400;font-size:18px;text-align:center;color:var(--accent-deep2);}
.bin.over{border-color:var(--accent2);background:var(--accent2-soft);}
.bin .chip{font-size:15px;padding:5px 8px;}
@media (max-width:520px){ .bins{grid-template-columns:repeat(var(--n),minmax(0,1fr));} .bin .chip{font-size:13px;} .bin h4{font-size:15px;} }

/* ---------- Feedback ---------- */
#fb{position:absolute;z-index:30;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  width:min(560px,calc(100% - 24px));border-radius:18px;padding:14px 16px;background:var(--card);color:var(--card-ink);
  box-shadow:0 20px 50px rgba(0,0,0,.4);border-top:8px solid var(--ok);animation:fbIn .4s cubic-bezier(.2,1.4,.4,1);}
#fb[hidden]{display:none!important;}
#fb.bad{border-top-color:var(--warn);}
@keyframes fbIn{from{opacity:0;transform:translate(-50%,40px)}to{opacity:1;transform:translate(-50%,0)}}
.fb-h{font-family:var(--f-display);font-size:24px;display:flex;align-items:center;gap:8px;}
.fb-h .pts{margin-inline-start:auto;font-family:var(--f-ui);font-weight:800;font-size:15px;color:#13804a;background:var(--ok-soft);border-radius:999px;padding:2px 10px;}
.fb-ans{font-family:var(--f-text);font-weight:700;font-size:17px;margin:6px 0 2px;color:#13804a;}
.fb-exp{font-family:var(--f-text);font-size:16px;line-height:1.8;margin:4px 0 0;color:#3a3f4b;}

/* ---------- Screens ---------- */
.screen{position:absolute;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
  padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at center,rgba(0,0,0,.15),rgba(0,0,0,.55));overflow:auto;}
.screen[hidden]{display:none!important;}
.sc-card{width:min(560px,100%);background:var(--card);color:var(--card-ink);border-radius:26px;padding:22px 20px 20px;text-align:center;
  box-shadow:0 30px 70px rgba(0,0,0,.45);border:4px solid var(--accent);animation:panelIn2 .55s cubic-bezier(.2,1.3,.4,1);margin:auto;}
@keyframes panelIn2{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.sc-logo{display:flex;align-items:center;justify-content:center;gap:8px;font-size:12px;font-weight:800;color:#6b6252;}
.sc-logo img{width:30px;height:30px;}
.sc-kicker{font-weight:800;font-size:13px;color:var(--accent-deep2);margin-top:10px;letter-spacing:.02em;}
.sc-title{font-family:var(--f-display);font-weight:400;font-size:clamp(34px,6vw,50px);line-height:1.15;margin:4px 0 6px;color:var(--accent-deep2);text-wrap:balance;}
.sc-sub{font-size:16px;color:#4b4f5c;margin:0 0 12px;line-height:1.7;}
.how{display:grid;gap:8px;text-align:right;margin:10px 0 14px;padding:0;list-style:none;}
.how li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.6;background:#fdf6e6;border-radius:12px;padding:8px 12px;}
.how li b{flex:none;width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-size:13px;}
.name-in{width:100%;box-sizing:border-box;font:700 17px var(--f-ui);padding:10px 14px;border-radius:12px;border:2px solid var(--card-line);margin-bottom:12px;text-align:center;background:#fff;color:var(--card-ink);user-select:text;-webkit-user-select:text;}
.name-in:focus{outline:none;border-color:var(--accent);}
.big{font-size:26px;padding:12px 36px;}
.credit{font-size:13px;color:#7a705c;margin-top:14px;}
.stars{display:flex;justify-content:center;gap:6px;margin:6px 0;}
.stars svg{width:58px;height:58px;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2));}
.stars svg.off{opacity:.2;filter:grayscale(1);}
.stars svg.on{animation:starIn .6s cubic-bezier(.2,1.6,.4,1) both;}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0;}
.res-grid div{background:#fdf6e6;border-radius:14px;padding:8px 4px;}
.res-grid b{display:block;font-family:var(--f-display);font-weight:400;font-size:28px;color:var(--accent-deep2);font-variant-numeric:tabular-nums;}
.res-grid span{font-size:12px;font-weight:700;color:#6b6252;}
.review{text-align:right;max-height:34vh;overflow:auto;margin-top:8px;display:grid;gap:8px;}
.review details{background:#fdf6e6;border-radius:12px;padding:8px 12px;}
.review summary{font-weight:800;cursor:pointer;font-size:14px;}
.review p{margin:6px 0 0;font-family:var(--f-text);font-size:15px;line-height:1.8;}
.cert-name{font-family:var(--f-display);font-size:26px;color:var(--card-ink);}
.stage-card .sc-title{font-size:clamp(30px,6vw,44px);}
.stage-num{font-family:var(--f-display);font-size:64px;line-height:1;color:var(--accent);}

/* ---------- Choice skins per world ---------- */
[data-skin="gate"] .choice{background:linear-gradient(#fff9e8,#ffe7a8);border-radius:14px 14px 6px 6px;box-shadow:0 6px 0 #c77d1a,0 12px 20px rgba(0,0,0,.25);border-top:7px solid #e8462f;}
[data-skin="gate"] .choice::before{content:"";position:absolute;inset:auto -10px -26px;height:26px;border-left:7px solid #6b4a2b;border-right:7px solid #6b4a2b;}
[data-skin="scroll"] .choice{background:linear-gradient(90deg,#d9b778,#f7e6be 12%,#fbefd2 50%,#f7e6be 88%,#d9b778);border-radius:8px;
  box-shadow:0 8px 18px rgba(0,0,0,.35);border-inline:9px solid #9b6b33;}
[data-skin="ledge"] .choice{background:linear-gradient(#c98a55,#9a5f35);color:#fff8ec;border-radius:22px 30px 10px 14px;
  box-shadow:inset 0 4px 0 rgba(255,255,255,.25),0 10px 0 #5e3a20,0 16px 22px rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.4);}
[data-skin="planet"] .choice{background:radial-gradient(circle at 30% 25%,#8ff0ff,#4d7cff 45%,#3a2a8f);color:#fff;border-radius:999px;padding:14px 20px;
  box-shadow:0 0 0 4px rgba(255,255,255,.18),0 0 26px rgba(120,160,255,.7);text-shadow:0 1px 3px rgba(0,0,0,.5);}
[data-skin="bubble"] .choice{background:radial-gradient(circle at 30% 25%,rgba(255,255,255,.95),rgba(190,240,255,.55) 40%,rgba(120,210,255,.35));
  color:#033049;border-radius:999px;padding:14px 20px;box-shadow:inset 0 -6px 14px rgba(0,90,140,.25),0 0 0 2px rgba(255,255,255,.7),0 8px 20px rgba(0,30,60,.35);
  animation:popIn .5s cubic-bezier(.2,1.5,.4,1) backwards,bob 3s ease-in-out infinite .5s;}
@keyframes bob{50%{margin-top:-8px}}
[data-skin="sign"] .choice{background:repeating-linear-gradient(0deg,#b97a3f 0 9px,#a96c33 9px 11px);color:#fff7e6;border-radius:6px 18px 18px 6px;
  box-shadow:0 7px 0 #6e4420,0 12px 18px rgba(0,0,0,.35);text-shadow:0 1px 2px rgba(0,0,0,.5);}
[data-skin="sign"] .choice::before{content:"";position:absolute;left:50%;top:100%;width:9px;height:40px;margin-left:-4px;background:#6e4420;z-index:-1;}
[data-skin="block"] .choice{background:linear-gradient(#ffd23f,#f5a524);color:#2a1d00;border-radius:6px;
  box-shadow:inset 0 0 0 3px rgba(0,0,0,.12),0 7px 0 #b06e00,0 14px 20px rgba(0,0,0,.4);}
[data-skin="block"] .choice::before{content:"";position:absolute;left:50%;bottom:100%;width:2px;height:60vh;background:rgba(220,230,255,.55);}

@media (max-width:600px){
  .hud-title{font-size:13px;}
  .pill{padding:3px 8px;font-size:13px;}
  #banner{padding:8px 12px 10px;border-radius:14px;}
  .choice{padding:10px 12px;}
}
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;} }

:root{--bg0:#0b0d2b;--accent:#7c5cff;--accent-ink:#ffffff;--accent-deep:#4b33c4;--accent2:#e0408a;--accent2-soft:#fde4f0;--accent-deep2:#4b33c4;--choice-ink:#1d2433;}
</style>
<div id="app">
  <canvas id="world" aria-label="عالم اللعبة"></canvas>
  <header id="hud"></header>
  <div id="banner" hidden></div>
  <div id="choices"></div>
  <div id="panel" hidden></div>
  <div id="fb" hidden role="status" aria-live="polite"></div>
  <section class="screen" id="s-start" hidden></section>
  <section class="screen" id="s-stage" hidden></section>
  <section class="screen" id="s-end" hidden></section>
</div>
<script>
window.GAME = {
  id: "g12-fail", world: "space", file: "12-faail-wa-mafool",
  title: "صاروخ الفاعل والمفعول", lesson: "الحصة 12 · الفاعل والمفعول به: تمارين تطبيقية", grade: "اللغة العربية · الصف الخامس",
  story: "استعد للإقلاع! صاروخك يجوب المجرّة بحثًا عن كواكب الجملة الفعلية. اختر الكوكب الصحيح في كل محطة لتصل إلى أبعد نجم.",

  stages: ["مدار الأرض", "حزام النيازك", "سديم الأفعال", "النجم البعيد"],
  stageTips: ["الفعل حدث مقترن بزمن: ماضٍ ومضارع وأمر.", "الجملة الفعلية: فعل + فاعل، وقد تشتمل على مفعول به.", "الفاعل مرفوع دائمًا، والمفعول به منصوب.", "التحدي الأخير: الإعراب وضبط أواخر الكلمات!"],
  stageWins: ["إقلاع ناجح!", "عبرت حزام النيازك!", "اخترقت السديم!", "وصلت إلى النجم البعيد!"],
  winTitle: "رائد فضاء الجملة الفعلية!",
  questions: [
    { t: "classify", d: 1, q: "صنّف الأفعال الآتية بحسب زمنها:", bins: ["ماضٍ", "مضارع", "أمر"], items: [["أكلَ", 0], ["كتبَ", 0], ["يأكلُ", 1], ["يكتبُ", 1], ["كُلْ", 2], ["اكتبْ", 2]], e: "الماضي حدث وانتهى، والمضارع يحدث الآن أو في المستقبل، والأمر طلب حدوث الفعل." },
    { t: "mcq", d: 1, q: "الفعل الماضي هو الفعل الذي:", o: ["حدث وانتهى", "يحدث الآن أو في المستقبل", "يُطلب به حدوث الفعل", "لا يدل على زمن"], e: "الفعل الماضي حدث وانتهى، مثل: أكلَ، كتبَ." },
    { t: "match", d: 1, q: "صِل كل نوع من الجمل بما يبدأ به:", p: [["جملة اسمية", "تبدأ باسم"], ["جملة فعلية", "تبدأ بفعل"], ["شبه جملة", "تبدأ بحرف"]], e: "نحدد نوع الجملة من أول كلمة فيها." },
    { t: "mcq", d: 2, q: "إعراب «رسالةً» في «كتبتُ رسالةً إلى صديقي»:", o: ["مفعول به منصوب وعلامة نصبه الفتحة الظاهرة", "فاعل مرفوع وعلامة رفعه الضمة الظاهرة", "مبتدأ مرفوع وعلامة رفعه الضمة", "اسم مجرور وعلامة جره الكسرة"], e: "الرسالة وقع عليها فعل الكتابة، فهي مفعول به منصوب." },
    { t: "mcq", d: 2, q: "إعراب «الأطفالُ» في «حضرَ الأطفالُ الحفلَ»:", o: ["فاعل مرفوع وعلامة رفعه الضمة الظاهرة", "مفعول به منصوب وعلامة نصبه الفتحة", "مبتدأ مرفوع وعلامة رفعه الضمة", "خبر مرفوع وعلامة رفعه الضمة"], e: "الأطفال هم من قاموا بالحضور، فهم فاعل مرفوع." },
    { t: "mcq", d: 2, q: "إعراب «يزرعُ» في «يزرعُ الفلّاحُ الأرضَ في الربيع»:", o: ["فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة", "فعل ماضٍ مبني على الفتح", "فعل أمر مبني على السكون", "فاعل مرفوع وعلامة رفعه الضمة"], e: "«يزرعُ» فعل مضارع مرفوع وعلامة رفعه الضمة الظاهرة على آخره." },
    { t: "mcq", d: 2, q: "نوع الفعل «سافرَتْ» في «سافرَتِ الطالبةُ إلى مسقط»:", o: ["فعل ماضٍ", "فعل مضارع", "فعل أمر", "ليس فعلًا"], e: "«سافرت» فعل ماضٍ حدث وانتهى، والتاء للتأنيث، و«الطالبةُ» فاعل." },

    { t: "tf", d: 2, q: "لا بدّ أن تشتمل كل جملة فعلية على مفعول به.", a: false, e: "الجملة الفعلية تتكون من فعل وفاعل، وقد تشتمل على مفعول به، مثل: تتألق النجوم في سماء الليل." },
    { t: "tf", d: 1, q: "الفاعل مرفوع دائمًا.", a: true, e: "معلومة مفيدة من الدرس: الفعل قد يكون ماضيًا أو مضارعًا أو أمرًا، والفاعل مرفوع دائمًا." },
    { t: "catch", d: 2, q: "التقط الفاعل من القطعة: «يُنيرُ العلمُ العقولَ... يقرأُ الطالبُ الكتابَ... ويشرحُ المعلمُ الدرسَ؛ لذلك يقدّرُ المجتمعُ العلماءَ»", ok: ["العلمُ", "الطالبُ", "المعلمُ", "المجتمعُ"], no: ["العقولَ", "الكتابَ", "الدرسَ", "العلماءَ"], e: "الفاعل مرفوع: العلمُ، الطالبُ، المعلمُ، المجتمعُ. والمنصوبات مفعولات به." },

    { t: "order", d: 2, q: "رتّب البطاقات لتكوّن جملة فعلية:", w: ["يزرعُ", "الفلّاحُ", "الأرضَ", "في الربيعِ"], e: "فعل (يزرعُ) ← فاعل (الفلاحُ) ← مفعول به (الأرضَ) ← في الربيعِ." },

<script>
/* World: a rocket flying through a starfield; answers are glowing planets */
window.WORLD = {
  skin: "planet", verb: "وجّه صاروخك نحو الكوكب الصحيح", verbTF: "اهبط على كوكب الصواب أو الخطأ",
  music: { bpm: 100, root: 57, scale: [0, 3, 5, 7, 10], wave: "sine" },
  colors: { particle: ["#ffffff", "#7c5cff", "#ff5eb1", "#55e6ff", "#ffd23f"], item: "#2a2363", itemStroke: "#8f7bff", itemInk: "#ffffff" },
  runSpeed: 900, idleSpeed: 90,
  init() { const r = GE.seeded(400); this.stars = []; for (let i = 0; i < 180; i++) this.stars.push({ x: r[i], y: r[i + 180], z: .2 + r[(i * 7) % 400] * .8 }); this.r = r; },
  home(W, H) { return { x: W / 2, y: H * .85 }; },
  clearance() { return 120; },
  target(s, W, H) { return { x: s.x, y: s.y + 80 }; },
  drawItem(ctx, it, t) {
    ctx.fillStyle = "#4b4370"; ctx.strokeStyle = "#a59cff"; ctx.lineWidth = 2;
    ctx.beginPath(); const n = 9; for (let k = 0; k < n; k++) { const a = k / n * Math.PI * 2, rr = 1 + .08 * Math.sin(k * 3.3); ctx.lineTo(Math.cos(a) * it.w / 2 * rr, Math.sin(a) * (it.h / 2 + 6) * rr); } ctx.closePath(); ctx.fill(); ctx.stroke();
  },
  draw(ctx, W, H, t, S) {
    const sc = S.scroll;
    ctx.fillStyle = GE.grad(ctx, 0, H, ["#05061a", "#120f3d", "#2a1350"]); ctx.fillRect(0, 0, W, H);
    // nebulae
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    [[.2, .3, "rgba(124,92,255,.22)", 260], [.85, .55, "rgba(255,94,177,.16)", 300], [.5, .9, "rgba(85,230,255,.12)", 320]].forEach(([nx, ny, c, rad], i) => {
      const y = ((ny * H + sc * .03 * (i + 1)) % (H + 400)) - 200, g = ctx.createRadialGradient(nx * W, y, 0, nx * W, y, rad); g.addColorStop(0, c); g.addColorStop(1, "rgba(0,0,0,0)"); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); });
    ctx.restore();
    // stars streak with speed
    const streak = Math.min(40, S.speed / 22);
    for (const s of this.stars) { const y = ((s.y * H + sc * s.z * .9) % H), x = s.x * W, sz = s.z * 2.2;
      ctx.fillStyle = "rgba(255,255,255," + (.35 + s.z * .6) + ")"; ctx.fillRect(x, y - streak * s.z, sz, sz + streak * s.z); }
    // big ringed planet drifting by
    const py = ((sc * .12) % (H + 600)) - 300, px = W * .82;
    const pg = ctx.createRadialGradient(px - 30, py - 30, 10, px, py, 90); pg.addColorStop(0, "#ffc98b"); pg.addColorStop(1, "#c2410c");
    ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(px, py, 80, 0, 7); ctx.fill();
    ctx.strokeStyle = "rgba(255,220,180,.7)"; ctx.lineWidth = 6; ctx.beginPath(); ctx.ellipse(px, py, 130, 26, -.35, 0, 7); ctx.stroke();
    const py2 = ((sc * .07 + H * .6) % (H + 400)) - 200; ctx.fillStyle = "#3d7bd9"; ctx.beginPath(); ctx.arc(W * .1, py2, 34, 0, 7); ctx.fill(); ctx.fillStyle = "rgba(255,255,255,.25)"; ctx.beginPath(); ctx.arc(W * .1 - 10, py2 - 10, 14, 0, 7); ctx.fill();
    this.rocket(ctx, S.px, S.py, Math.min(1.2, Math.max(.75, H / 760)), t, S);

/* ----- ordering ----- */
function askOrder(q) {
  const p = openPanel("اضغط البطاقات بالترتيب الصحيح، ثم اضغط «تحقّق»");
  const ans = el("div", "answer-row"); ans.dataset.ph = "ضع البطاقات هنا بالترتيب"; const pool = el("div", "row");
  const btns = el("div", "center"), check = el("button", "btn", "تحقّق"); check.disabled = true; btns.appendChild(check);
  p.append(ans, pool, btns);
  let order = shuffle(q.w.map((w, i) => ({ w, i })));
  if (order.every((o, k) => o.i === k)) order = order.reverse();
  const refresh = () => { check.disabled = ans.children.length !== q.w.length; };
  order.forEach(o => {
    const c = el("button", "chip", o.w); c._i = o.i; pool.appendChild(c);
    c.onclick = () => { if (busy || c.classList.contains("ok")) return; SND.fx("tap"); (c.parentNode === pool ? ans : pool).appendChild(c); refresh(); };
  });
  check.onclick = () => {
    if (busy) return; const placed = [...ans.children];
    if (placed.every((c, k) => c._i === k)) { busy = true; placed.forEach(c => c.classList.add("ok")); const m = centerOf(ans); good(m.x, m.y); setTimeout(finish, 900); return; }
    const m = centerOf(ans); mistake(m.x, m.y - 30);
    if (cur.mistakes >= 2) { busy = true; cur.revealed = true; placed.sort((a, b) => a._i - b._i).forEach(c => { ans.appendChild(c); c.classList.add("ok"); }); setTimeout(finish, 1200); return; }
    placed.forEach((c, k) => { if (c._i === k) c.classList.add("ok"); else { c.classList.add("bad"); setTimeout(() => { c.classList.remove("bad"); pool.appendChild(c); refresh(); }, 500); } });
    // keep only a correct prefix in place
    let firstWrong = placed.findIndex((c, k) => c._i !== k);
    placed.forEach((c, k) => { if (k > firstWrong && c.classList.contains("ok")) { c.classList.remove("ok"); setTimeout(() => { pool.appendChild(c); refresh(); }, 500); } });
  };
}

/* ----- catch mini game (canvas) ----- */
let C = null;
function askCatch(q) {
  const h = WD.home(W, H);
  C = { q, need: q.ok.length, got: new Set(), items: [], spawn: .3, cy: WD.catchY ? WD.catchY(W, H) : h.y, ended: false };
  S.mode = "catch"; S.tx = W / 2; S.ty = C.cy; updateCount();
}
function updateCount() { const c = $("#ccount"); if (c && C) c.textContent = "التقطت " + C.got.size + " من " + C.need + " · اسحب أو اضغط على البطاقة"; }
function catchStep(dt) {
  if (!C || C.ended) return;
  const top = bannerBottom() + 10, maxOn = W < 600 ? 3 : 4, v = H * (.1 + (C.q.d || 2) * .012);
  C.spawn -= dt;
  if (C.spawn <= 0 && C.items.length < maxOn) {
    C.spawn = rand(.9, 1.6);
    const onScreen = new Set(C.items.map(i => i.text));
    const okLeft = C.q.ok.filter(t => !C.got.has(t) && !onScreen.has(t)), no = C.q.no.filter(t => !onScreen.has(t));
    let pickOk = okLeft.length && (Math.random() < .55 || !no.length);
    const text = pickOk ? okLeft[Math.floor(Math.random() * okLeft.length)] : (no.length ? no[Math.floor(Math.random() * no.length)] : null);
    if (text) {
      ctx.font = "700 18px 'Noto Naskh Arabic', serif"; const w = Math.max(64, ctx.measureText(text).width + 30), hh = 42;
      let x, tries = 0; do { x = rand(w / 2 + 12, W - w / 2 - 12); tries++; } while (tries < 12 && C.items.some(o => Math.abs(o.x - x) < (o.w + w) / 2 + 10 && o.y < top + 120));
      C.items.push({ text, ok: C.q.ok.includes(text), x, y: top - 10, w, h: hh, vy: v * rand(.85, 1.15), ph: rand(0, 6), pull: false });
    }
  }
  const col = WD.colors;
  for (let i = C.items.length - 1; i >= 0; i--) {
    const it = C.items[i]; it.y += it.vy * dt * (it.pull ? 6 : 1); it.ph += dt * 2;
    const x = it.x + (it.pull ? 0 : Math.sin(it.ph) * 6);
    if (it.pull) it.x = lerp(it.x, S.px, Math.min(1, dt * 8));
    if (Math.abs(x - S.px) < it.w / 2 + 30 && it.y > C.cy - 70 && it.y < C.cy + 20) { C.items.splice(i, 1); grab(it); continue; }
    if (it.y > H + 30) { C.items.splice(i, 1); continue; }
    ctx.save(); ctx.translate(x, it.y);
    if (WD.drawItem) WD.drawItem(ctx, it, S.t); else { ctx.fillStyle = col.item; ctx.strokeStyle = col.itemStroke; ctx.lineWidth = 3; GE.rr(ctx, -it.w / 2, -it.h / 2, it.w, it.h, 14); ctx.fill(); ctx.stroke(); }
    ctx.fillStyle = col.itemInk; ctx.font = "700 18px 'Noto Naskh Arabic', serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl"; ctx.fillText(it.text, 0, 1);
    ctx.restore();
  }
}
function grab(it, gx, gy) {
  const x = gx == null ? S.px : gx, y = gy == null ? C.cy - 40 : gy;
  if (it.ok) { if (C.got.has(it.text)) return; C.got.add(it.text); SND.fx("coin"); burst(x, y, 14); floatText("+ " + it.text, x, y - 30, "#c8ffd9"); S.mood = "happy"; S.moodT = .8; updateCount();
    if (C.got.size === C.need) { C.ended = true; C.items = []; good(x, y); setTimeout(() => { S.mode = "idle"; finish(); }, 900); } }
  else { mistake(); floatText("✗ " + it.text, x, y - 30, "#ffc4c4"); }
}
function catchPointer(e) {
  if (S.mode !== "catch" || !C || C.ended) return;
  const r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
  const hit = C.items.find(it => Math.abs(x - it.x) < it.w / 2 + 10 && Math.abs(y - it.y) < it.h / 2 + 12);
  if (hit && e.type === "pointerdown") { C.items.splice(C.items.indexOf(hit), 1); S.tx = hit.x; grab(hit, hit.x, hit.y); return; }
  S.tx = clamp(x, 30, W - 30);
}
cv.addEventListener("pointerdown", e => { catchPointer(e); cv._down = true; });
cv.addEventListener("pointermove", e => { if (cv._down || e.pointerType === "mouse") catchPointer(e); });
window.addEventListener("pointerup", () => { cv._down = false; });

/* ---------- finishing a question ---------- */
const PRAISE = ["أحسنت!", "رائع!", "ممتاز!", "إجابة موفّقة!", "بطل!", "تألّق!"];
function answerText(q) {
  switch (q.t) {
    case "mcq": case "fill": return q.t === "fill" ? q.s.replace("___", "«" + q.o[0] + "»") : q.o[0];
    case "tf": return q.a ? "العبارة صحيحة" : "العبارة خاطئة";
    case "match": return q.p.map(p => p[0] + " ← " + p[1]).join(" | ");
    case "order": return q.w.join(" ");
    case "classify": return q.bins.map((b, i) => b + ": " + q.items.filter(it => it[1] === i).map(it => it[0]).join("، ")).join(" | ");
    case "pick": return q.w[q.a];
    case "gap": return q.w.map((w, i) => w + (i === q.a ? "،" : "")).join(" ");
    case "catch": return q.ok.join("، ");
  }
}
function finish() {
  const q = curQ, clean = cur.mistakes === 0 && !cur.revealed;
  let pts = 0;
  if (cur.revealed) { streak = 0; results[qi] = "r"; }
  else if (clean) { streak++; pts = 100 + Math.min(streak - 1, 5) * 20; results[qi] = "c"; S.correct++; }
  else { streak = 0; pts = 50; results[qi] = "m"; S.correct++; }
  score += pts; hud(); if (pts) bump("#scorepill");
  if (!clean) (cur.revealed || cur.mistakes) && missed.add(q.id);
  const fb = $("#fb"); fb.hidden = false; fb.className = clean ? "" : "bad";
  const head = clean ? PRAISE[Math.floor(Math.random() * PRAISE.length)] + (streak > 2 ? " — سلسلة " + streak + " 🔥" : "") : (cur.revealed ? "لا بأس، تعلّمنا شيئًا جديدًا" : "أصبت بعد محاولة");
  fb.innerHTML = '<div class="fb-h">' + head + (pts ? '<span class="pts">+' + pts + "</span>" : "") + "</div>" +
    (clean ? "" : '<div class="fb-ans">الإجابة: ' + answerText(q) + "</div>") + (q.e ? '<p class="fb-exp">' + q.e + "</p>" : "") +
    '<div class="center"><button class="btn" id="fbgo">' + (clean ? "تابع المغامرة" : "فهمت، تابع") + "</button></div>";
  const go = () => { if (fb.hidden) return; fb.hidden = true; clearTimeout(fb._t); advance(); };
  $("#fbgo").onclick = go; $("#fbgo").focus({ preventScroll: true });
  if (clean) fb._t = setTimeout(go, 2600 + (q.e ? Math.min(2500, q.e.length * 25) : 0));
}
const missed = new Set();

function advance() {
  closePanel(); $("#choices").innerHTML = ""; choiceEls = []; $("#banner").hidden = true;
  const h = WD.home(W, H); S.tx = h.x; S.ty = h.y; S.mode = "run"; S.tspeed = WD.runSpeed || 420; SND.fx("whoosh");
  if (WD.onAdvance) WD.onAdvance(S, results[qi]);
  setTimeout(() => {
    S.tspeed = WD.idleSpeed || 40; S.mode = "idle";
    if (hearts <= 0 && !practice) return stageFail();
    qi++;
    if (qi >= queue.length) return endGame();
    if (!practice && qi % STAGE_N === 0) return stageClear();
    ask();
  }, 1300);
}

  const title = practice ? "انتهى التدريب" : (stars === 3 ? G.winTitle || "بطل المغامرة!" : stars === 2 ? "مغامر متميّز!" : "أنهيت المغامرة!");

    (score > best && best && !practice ? '<p class="sc-sub">رقم قياسي جديد! تجاوزت ' + best + " نقطة</p>" : "") +
    (miss.length ? '<div class="review">' + miss.map(q => "<details><summary>" + stripTags(q.q) + "</summary><p><b>الإجابة:</b> " + answerText(q) + "</p>" + (q.e ? "<p>" + q.e + "</p>" : "") + "</details>").join("") + "</div>" : '<p class="sc-sub">لم تخطئ في أي سؤال. إتقان كامل!</p>') +
    '<div class="center">' + (miss.length ? '<button class="btn" id="prac">تدرّب على أخطائي (' + miss.length + ")</button>" : "") + '<button class="btn alt" id="again">العب من جديد</button></div>' +
    '<div class="credit">إعداد: أ. راشد الهادي · أكاديمية همم التعليمية</div></div>');
  $("#again").onclick = () => { SND.fx("tap"); newGame(false); };
  if (miss.length) $("#prac").onclick = () => { SND.fx("tap"); newGame(true, miss); };
}
function stripTags(s) { return s.replace(/<[^>]+>/g, ""); }

/* ---------- keyboard ---------- */
window.addEventListener("keydown", e => {
  if (e.target.tagName === "INPUT") { if (e.key === "Enter") $("#go") && $("#go").click(); return; }
  if (/^[1-4]$/.test(e.key) && choiceEls[+e.key - 1]) choiceEls[+e.key - 1].click();
  if (S.mode === "catch") { if (e.key === "ArrowLeft") S.tx = clamp(S.tx - 70, 30, W - 30); if (e.key === "ArrowRight") S.tx = clamp(S.tx + 70, 30, W - 30); }
});

/* ---------- boot ---------- */
function boot() {
  document.title = G.title;
  $("#hud").innerHTML = '<img class="hud-logo" src="' + G.logo + '" alt="همم"><div class="hud-mid"><div class="hud-title">' + G.title + '</div><div id="bar"></div></div>' +
    '<div class="hud-stats"><div class="pill" id="scorepill">' + IC.coin + '<span id="score">0</span></div><div id="hearts"></div>' +
    '<button class="icon-btn" id="mus" aria-label="الموسيقى">' + IC.music + '</button><button class="icon-btn" id="sfx" aria-label="المؤثرات الصوتية">' + IC.sound + "</button></div>";
  $("#mus").onclick = () => { SND.init(); SND.startMusic(); SND.musicOn = !SND.musicOn; $("#mus").classList.toggle("off", !SND.musicOn); };
  $("#sfx").onclick = () => { SND.init(); SND.sfxOn = !SND.sfxOn; $("#sfx").classList.toggle("off", !SND.sfxOn); };
  if (WD.init) WD.init();
  resize(); window.addEventListener("resize", resize);
  const h = WD.home(W, H); S.px = h.x; S.py = h.y; S.tx = h.x; S.ty = h.y;
  queue = allQ.slice(0, 20); hud(); queue = [];
  startScreen(); requestAnimationFrame(t => { last = t; requestAnimationFrame(frame); });
}
boot();
})();

</script>
